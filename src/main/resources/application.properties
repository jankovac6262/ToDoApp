spring.application.name=example

# Lokalne tajne udaje (heslo do DB) sa nacitaju zo suboru .env v koreni projektu.
# Subor .env je v .gitignore, takze sa nikdy nedostane do repozitara.
# "optional:" -> ak subor neexistuje, aplikacia nespadne (hodnoty mozu prist z premennych prostredia)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL - hodnoty sa beru z premennych prostredia / .env,
# za dvojbodkou je predvolena hodnota pre lokalny vyvoj.
# Heslo predvolenu hodnotu zamerne nema.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tododb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Schemu databazy spravuje Flyway (SQL subory v src/main/resources/db/migration).
# Hibernate uz tabulky nevytvara ani nemeni, iba pri starte overi (validate),
# ze schema v DB sedi s entitami - ak nie, aplikacia sa vobec nespusti.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Databaza uz obsahuje tabulku tasks (vytvoril ju predtym Hibernate), ale nema
# historiu migracii. baseline-on-migrate ju oznaci ako verziu 1, takze V1 sa preskoci
# a existujuce data ostanu. Na prazdnej databaze sa V1 normalne vykona.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
