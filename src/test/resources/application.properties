spring.application.name=example

# Testy nepouzivaju PostgreSQL, ale H2 v pamati - netreba bezat DB server ani heslo.
# Tento subor pri testoch uplne nahradi src/main/resources/application.properties.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# Schemu vytvori Flyway rovnakymi migraciami ako v produkcii, Hibernate ju len overi.
# Testy tak zaroven kontroluju, ze migracie sedia s entitami.
spring.jpa.hibernate.ddl-auto=validate
